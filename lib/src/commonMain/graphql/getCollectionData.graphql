query getCollectionData(
  $where_condition: current_collections_v2_bool_exp!
  $offset: Int
  $limit: Int
) {
  current_collections_v2(where: $where_condition, offset: $offset, limit: $limit) {
    uri
    total_minted_v2
    token_standard
    table_handle_v1
    mutable_uri
    mutable_description
    max_supply
    collection_id
    collection_name
    creator_address
    current_supply
    description
    last_transaction_timestamp
    last_transaction_version
  }
}
